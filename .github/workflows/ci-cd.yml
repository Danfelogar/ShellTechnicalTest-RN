name: React Native CI/CD

on:
  push:
    branches: [feature-CI/CD, master]
  pull_request:
    branches: [feature-CI/CD, master]

env:
  NODE_VERSION: '22.19.0'
  PNPM_VERSION: '9.9.0'

jobs:
  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v2
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Create .env file
        run: |
          echo "API_URL=${{ secrets.API_URL }}" > .env
          echo "API_TOKEN=${{ secrets.API_TOKEN }}" >> .env

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Cache Gradle packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Build Android Release APK
        run: |
          cd android
          chmod +x ./gradlew
          ./gradlew clean
          ./gradlew assembleRelease --no-daemon --stacktrace

      - name: List generated APKs
        run: |
          echo "📱 APKs generados:"
          find android/app/build/outputs -name "*.apk" -type f
          ls -lh android/app/build/outputs/apk/release/ || true

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-release-apk
          path: android/app/build/outputs/apk/release/app-release.apk
          retention-days: 7

  build-ios:
    name: Build iOS IPA
    runs-on: macos-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v2
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Cache CocoaPods
        uses: actions/cache@v4
        with:
          path: ios/Pods
          key: ${{ runner.os }}-pods-${{ hashFiles('**/Podfile.lock') }}
          restore-keys: |
            ${{ runner.os }}-pods-

      - name: Install CocoaPods dependencies
        run: |
          cd ios
          pod install --repo-update
          cd ..

      - name: Create .env file
        run: |
          echo "API_URL=${{ secrets.API_URL }}" > .env
          echo "API_TOKEN=${{ secrets.API_TOKEN }}" >> .env

      - name: List schemes
        run: |
          cd ios
          xcodebuild -workspace ShellTechnicalTestRN.xcworkspace -list

      - name: Build iOS for simulator (TEST)
        run: |
          xcodebuild \
            -workspace ios/ShellTechnicalTestRN.xcworkspace \
            -scheme ShellTechnicalTestRN \
            -configuration Debug \
            -sdk iphonesimulator \
            -derivedDataPath ios/build \
            ONLY_ACTIVE_ARCH=YES \
            clean build

      - name: Create Export Options Plist
        run: |
          cat > ios/ExportOptions.plist << 'EOF'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>method</key>
              <string>development</string>
              <key>signingStyle</key>
              <string>automatic</string>
              <key>stripSwiftSymbols</key>
              <true/>
              <key>uploadBitcode</key>
              <false/>
              <key>compileBitcode</key>
              <false/>
              <key>uploadSymbols</key>
              <true/>
          </dict>
          </plist>
          EOF

      - name: Archive iOS Project
        run: |
          xcodebuild \
            -workspace ios/ShellTechnicalTestRN.xcworkspace \
            -scheme ShellTechnicalTestRN \
            -configuration Release \
            -archivePath build/ShellTechnicalTestRN.xcarchive \
            -allowProvisioningUpdates \
            clean archive

      - name: Export IPA
        run: |
          xcodebuild -exportArchive \
            -archivePath build/ShellTechnicalTestRN.xcarchive \
            -exportOptionsPlist ios/ExportOptions.plist \
            -exportPath build \
            -allowProvisioningUpdates

      - name: List build artifacts
        run: |
          echo "📦 Archivos generados en build/:"
          ls -lh build/ || true

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: ios-release-ipa
          path: build/ShellTechnicalTestRN.ipa
          retention-days: 7

  deploy-artifacts:
    name: Deploy Artifacts
    runs-on: ubuntu-latest
    needs: [build-android, build-ios]
    if: github.ref == 'refs/heads/feature-CI/CD' || github.ref == 'refs/heads/master'

    steps:
      - name: Download Android APK
        uses: actions/download-artifact@v4
        with:
          name: android-release-apk

      - name: Download iOS IPA
        uses: actions/download-artifact@v4
        with:
          name: ios-release-ipa

      - name: List final artifacts
        run: |
          echo "🎯 Artifacts listos para distribución:"
          ls -lh
          echo ""
          echo "📱 Android APK:"
          du -h app-release.apk 2>/dev/null || echo "APK no encontrado"
          echo ""
          echo "📱 iOS IPA:"
          du -h ShellTechnicalTestRN.ipa 2>/dev/null || echo "IPA no encontrado"